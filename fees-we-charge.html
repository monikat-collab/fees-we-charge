<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fees we charge | Affirm</title>
<style>
  /* Axiforma, if it's installed locally. Falls back to a geometric sans elsewhere. */
  @font-face { font-family:"AxiformaLocal"; src: local("Axiforma Light"), local("Axiforma-Light"), local("Axiforma Thin"); font-weight:300; font-display:swap; }
  @font-face { font-family:"AxiformaLocal"; src: local("Axiforma"), local("Axiforma-Regular"), local("Axiforma Regular"), local("Axiforma Book"); font-weight:400; font-display:swap; }
  @font-face { font-family:"AxiformaLocal"; src: local("Axiforma Medium"), local("Axiforma-Medium"), local("Axiforma SemiBold"); font-weight:500; font-display:swap; }
  @font-face { font-family:"AxiformaLocal"; src: local("Axiforma Bold"), local("Axiforma-Bold"), local("Axiforma Black"); font-weight:700; font-display:swap; }

  :root {
    color-scheme: dark;
    --bg: #100D1A;
    --ink: #FFFFFF;
    --pill-bg: rgba(255,255,255,0.035);
    --pill-line: rgba(160,150,235,0.28);
    --font: "AxiformaLocal", "Axiforma", ui-sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .bloom {
    position: fixed;
    top: -220px; left: 50%;
    transform: translateX(-50%);
    width: 1400px; height: 700px;
    background: radial-gradient(ellipse at center, rgba(96,86,190,0.22) 0%, rgba(16,13,26,0) 68%);
    z-index: 0; pointer-events: none;
  }

  /* two layers so most of the herd rolls OVER the headline and one drifts behind it */
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #back  { z-index: 1;  }
  #front { z-index: 25; }

  /* ---------- nav ---------- */
  .nav-wrap { position: fixed; top: 0; left: 0; right: 0; z-index: 40; padding: 18px 0 0; }
  .nav-inner { max-width: 1640px; margin: 0 auto; padding: 0 24px; }

  .strip { display: flex; gap: 28px; padding: 0 26px 12px; }
  .strip a { font-size: 14.5px; font-weight: 400; color: var(--ink); text-decoration: none; opacity: .92; }
  .strip a.on { text-decoration: underline; text-underline-offset: 4px; }
  .strip a:hover { opacity: 1; }

  .nav {
    display: flex; align-items: center; gap: 34px;
    padding: 12px 14px 12px 28px;
    border: 1px solid var(--pill-line);
    border-radius: 999px;
    background: rgba(16,13,26,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .logo { display: flex; align-items: center; text-decoration: none; }
  .logo img { display: block; height: 30px; width: auto; }

  .nav-links { display: flex; align-items: center; gap: 30px; }
  .nav-links a, .nav-links button {
    font-family: var(--font); font-size: 16px; font-weight: 400;
    color: var(--ink); text-decoration: none;
    background: none; border: 0; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    letter-spacing: -0.005em;
  }
  .nav-links a:hover, .nav-links button:hover { opacity: .75; }
  .caret { width: 11px; height: 7px; opacity: .9; }

  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .icon-btn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .icon-btn svg { width: 21px; height: 21px; }
  .nav-right > a { font-family: var(--font); font-size: 16px; font-weight: 400; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .pill-solid { background: #FFFFFF; color: #100D1A !important; padding: 13px 30px; border-radius: 999px; font-weight: 500 !important; }
  .pill-solid:hover { background: #E9E7F4; }
  .pill-ghost { border: 1px solid rgba(255,255,255,0.45); padding: 13px 28px; border-radius: 999px; }
  .pill-ghost:hover { background: rgba(255,255,255,0.08); }

  /* ---------- fixed headline ---------- */
  .headline {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20; pointer-events: none;
    text-align: center; width: 100%; padding: 0 24px;
  }
  .headline h1 {
    font-family: var(--font);
    font-weight: 300;
    font-size: clamp(46px, 7.6vw, 118px);
    line-height: 1.04;
    letter-spacing: -0.022em;
    margin: 0;
    color: var(--ink);
  }

  .hint {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%); z-index: 20;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 500; color: var(--ink); opacity: .38;
    pointer-events: none; transition: opacity .6s ease;
  }
  .hint.gone { opacity: 0; }

  #track { height: 900vh; position: relative; z-index: 0; }

  @media (max-width: 1080px) {
    .nav-links, .nav-right > a:not(.pill-solid), .icon-btn { display: none; }
    .nav { gap: 14px; padding: 10px 10px 10px 20px; }
    .strip { padding: 0 16px 10px; gap: 20px; }
  }
</style>
</head>

<div class="bloom"></div>

        <button>Discover
          <svg class="caret" viewBox="0 0 12 7" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button>Shop
          <svg class="caret" viewBox="0 0 12 7" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

        <a href="#">Help Center</a>

      <div class="nav-right">
        <button class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" aria-label="Region">

          <svg class="caret" viewBox="0 0 12 7" fill="none" style="width:11px;height:7px"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <a href="#">Log in</a>
        <a href="#" class="pill-solid">Sign up</a>
        <a href="#" class="pill-ghost">Check my purchasing power</a>
      </div>
    </nav>
  </div>
</header>

<script>
(function () {
  var hint = document.getElementById('hint');
  var cBack = document.getElementById('back');
  var cFront = document.getElementById('front');
  var xBack = cBack.getContext('2d');
  var xFront = cFront.getContext('2d');

  var sprite = new Image();
  var ready = false;
  sprite.onload = function () { ready = true; };
  sprite.src = WEED_SRC;

  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [cBack, cFront].forEach(function (c) {
      c.width = Math.floor(W * DPR);
      c.height = Math.floor(H * DPR);
      c.style.width = W + 'px';
      c.style.height = H + 'px';
    });
    xBack.setTransform(DPR, 0, 0, DPR, 0, 0);
    xFront.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();

  var virtual = 0;

  // Five tumbleweeds, hand-placed. `lane` is the resting height as a fraction of
  // the viewport — the headline sits at 0.5, so the front four are tuned to cross
  // it. Only the small distant one rides behind.
  var WEEDS = [
    // front layer — these roll over the text
    { r: 0.155, lane: 0.55, speed: 1.55, offset:    0, bounce: 46, spin: 0.86, fx:  1, fy:  1, squash: 1.00, alpha: 0.96, front: true },
    { r: 0.105, lane: 0.44, speed: 1.18, offset: 2600, bounce: 34, spin: 0.95, fx: -1, fy:  1, squash: 0.93, alpha: 0.88, front: true },
    { r: 0.135, lane: 0.60, speed: 1.34, offset: 5400, bounce: 40, spin: 0.78, fx:  1, fy: -1, squash: 1.05, alpha: 0.92, front: true },
    { r: 0.070, lane: 0.49, speed: 0.92, offset: 8100, bounce: 26, spin: 1.08, fx: -1, fy: -1, squash: 0.96, alpha: 0.80, front: true },
    // back layer — one far one drifting behind the headline
    { r: 0.048, lane: 0.71, speed: 0.46, offset: 3900, bounce: 16, spin: 1.15, fx:  1, fy:  1, squash: 0.98, alpha: 0.42, front: false }
  ];

  function radius(w) { return Math.max(34, Math.min(W, H * 1.35) * w.r); }

  function drawWeed(ctx, w) {
    var r = radius(w);
    var span = W + r * 8 + 1100;
    var x = W + r * 2.2 + 340 - ((virtual * w.speed + w.offset) % span);
    if (x < -r * 2.6 || x > W + r * 2.8) return;

    var groundY = H * w.lane;
    var hop = Math.abs(Math.sin(x * 0.0102 + w.offset)) * w.bounce;
    var y = groundY - hop;

    ctx.save();
    ctx.globalAlpha = w.alpha;
    ctx.translate(x, y);
    ctx.rotate(-x / r * w.spin);
    ctx.scale(w.fx, w.fy * w.squash);
    ctx.drawImage(sprite, -r, -r, r * 2, r * 2);
    ctx.restore();
  }

  function rng(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function drawDust(ctx) {
    var r = rng(5150);
    ctx.save();
    ctx.fillStyle = 'rgba(226, 206, 168, 0.18)';
    for (var i = 0; i < 44; i++) {
      var lane = 0.18 + r() * 0.78;
      var sp = 0.14 + r() * 0.6;
      var sz = 0.6 + r() * 1.5;
      var span = W + 280;
      var x = W + 140 - ((virtual * sp + r() * 6000) % span);
      var y = H * lane + Math.sin(x * 0.02 + i) * 7;
      ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    xBack.clearRect(0, 0, W, H);
    xFront.clearRect(0, 0, W, H);
    drawDust(xBack);
    if (!ready) return;
    for (var i = 0; i < WEEDS.length; i++) {
      var w = WEEDS[i];
      drawWeed(w.front ? xFront : xBack, w);
    }
  }

  // ---------- endless scroll ----------
  // Tall track; near either end we teleport back to the middle while a separate
  // cumulative counter keeps driving the animation, so the bar never bottoms out.
  var last = 0;
  function docMax() { return document.documentElement.scrollHeight - window.innerHeight; }

  function onScroll() {
    var y = window.scrollY;
    var delta = y - last;
    last = y;
    if (Math.abs(delta) > window.innerHeight * 2) return;   // swallow the teleport

    virtual += delta;
    if (virtual > 240) hint.classList.add('gone');

    var max = docMax();
    var mid = Math.round(max * 0.5);
    if (y > max - window.innerHeight * 1.3 || y < window.innerHeight * 0.7) {
      last = mid;
      window.scrollTo(0, mid);
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  function frame() { render(); requestAnimationFrame(frame); }

  function center() { var mid = Math.round(docMax() * 0.5); window.scrollTo(0, mid); last = mid; }
  center();
  window.addEventListener('load', function () { center(); render(); });
  window.addEventListener('resize', function () { resize(); center(); });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
